# chrome-eye bundle — always active when installed via `dsh plugin add`.
# Tools are always loaded. The bridge is included by default;
# profile cordis.patch.yml can override config (port, guiPort).

# Chrome Eye model-facing tools: screenshot, readPage, listTabs, getElementRect,
# autoFormFill, click, type, navigate, getPageText.
- insert:
    - id: chrome-eye-tools
      name: './plugins/chrome-eye-tools/index.js'

# Bridge plugin — serves the GUI and proxies to the webserver.
# Profile cordis.patch.yml can override config values:
#   port: 3085 (bridge listening port)
#   guiPort: 3080 (webserver port to proxy to)
- insert:
    - id: chrome-eye-bridge
      name: './plugins/chrome-eye-bridge/index.js'
      config:
        port: 3085
        guiPort: 3080
