# chrome-eye bundle — applies when a profile installs this package via
# `dsh plugin add github:crstalli/chrome-eye`.
#
# The bridge row is commented by default; users uncomment it in their
# profile's own cordis.patch.yml to enable the bridge lifecycle.
# The tools row is always active.

- insert:
    - id: chrome-eye-tools
      name: '@local/chrome-eye-tools'

# Uncomment below or override in your profile cordis.patch.yml to enable the bridge:
# - insert:
#     - id: chrome-eye-bridge
#       name: '@local/chrome-eye-bridge'
#       config:
#         port: 3081
#         guiPort: 3080
