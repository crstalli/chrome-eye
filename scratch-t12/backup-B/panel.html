<!DOCTYPE html>
<html>
<head>
    <title>Chrome Eye</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        #dsh-iframe {
            width: 100%;
            height: calc(100% - 60px); /* Reserve space for the bottom bar */
            border: none;
        }
        #bottom-bar {
            height: 60px;
            background: #f0f0f0;
            border-top: 1px solid #ccc;
            display: flex;
            align-items: center;
            padding: 0 10px;
            position: relative; /* anchor for the workspace dropdown */
        }
        #share-status {
            flex: 1 1 auto;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* T11.3 — always-present workspace-tree dropdown trigger(s) */
        #ws-controls {
            margin-left: auto;
            display: flex;
            gap: 6px;
            flex: none;
        }
        #ws-controls button {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #bbb;
            background: #ffffff;
            color: #222;
            cursor: pointer;
        }
        #ws-controls button:hover {
            background: #f5f5f5;
        }
        #ws-dropdown {
            position: absolute;
            bottom: 64px; /* just above the 60px bar */
            right: 10px;
            width: 320px;
            max-height: 420px;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 -6px 18px rgba(0, 0, 0, 0.16);
            overflow: hidden;
            z-index: 10;
        }
        #ws-dropdown[hidden] {
            display: none;
        }
        #ws-dd-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
            flex: none;
        }
        #ws-dd-title {
            font-weight: 600;
            font-size: 13px;
            flex: none;
        }
        #ws-dd-status {
            flex: 1;
            font-size: 12px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #ws-dd-body {
            overflow-y: auto;
            padding: 4px 6px 8px;
        }
    </style>
</head>
<body>
    <iframe id="dsh-iframe" src="http://127.0.0.1:3080"></iframe>
    <!-- T11.6: the "Share this page" button is gone; the context chip row
         in the GUI is the share UI. T11.3/T11.4 add the always-present
         workspace-tree dropdown ("Workspaces ▾") and the overlay toggle
         ("⛶ workspace") to the right of the status span. -->
    <div id="bottom-bar">
        <span id="share-status"></span>
        <div id="ws-controls">
            <button id="ws-overlay-btn" title="Open the workspace overlay over the GUI chat window (Esc or ✕ closes it)">⛶ workspace</button>
            <button id="ws-tree-btn" title="Browse workspaces & sessions in the DSH GUI">Workspaces ▾</button>
        </div>
        <div id="ws-dropdown" hidden>
            <div id="ws-dd-head">
                <span id="ws-dd-title">Workspaces</span>
                <span id="ws-dd-status"></span>
            </div>
            <div id="ws-dd-body"></div>
        </div>
    </div>
    <script src="panel.js"></script>
</body>
</html>
